research_manager_review_task:
  description: >
    Review the completed market research, competitive intelligence,
    and customer insights reports for {product_idea}.

    Evaluate:
    - consistency across reports
    - validity of market sizing assumptions
    - strength of competitive analysis
    - credibility of customer insights
    - source quality and evidence strength
    - missing risks, blind spots, and uncertainties

    Identify findings that are well-supported and findings that
    should be treated with caution.

    Produce a consolidated review that downstream strategy planning
    should use as the authoritative assessment of research quality.

  expected_output: >
    A JSON object matching the AgentOutput schema
  
  agent: research_manager


manager_synthesis_task:
  description: >
    Review all validated research.

    Resolve conflicting findings.

    Produce:
    - market opportunity assessment
    - product positioning
    - MVP definition
    - pricing strategy
    - go-to-market plan
    - business viability recommendation

    Explain tradeoffs and assumptions.

  expected_output: >
    A JSON object matching the AgentOutput schema.

  agent: strategy_manager