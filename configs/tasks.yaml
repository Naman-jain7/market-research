competitive_intelligence_task:
  description: >
    Scan the competitive landscape for {product_idea}. Identify direct,
    indirect, and adjacent competitors; compare positioning, features, pricing,
    customer segments, strengths, weaknesses, and likely responses to a new
    entrant. Cite sources for each competitor mentioned.
  expected_output: >
    A JSON object matching the AgentOutput schema
  agent: competitive_intelligence_analyst

