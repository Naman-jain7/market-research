market_research_task:
  description: >
    Conduct market research for {product_idea}. Include TAM/SAM/SOM, growth
    drivers, customer adoption signals, regulatory constraints, technology
    readiness, and important assumptions. Use current, cited data where
    available.
  expected_output: >
    A JSON object matching the AgentOutput schema
  agent: market_research_specialist

