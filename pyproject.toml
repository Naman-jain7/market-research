[project]
name = "market_research"
version = "1.0.0"
description = "A GenAI project with FastAPI"
readme = "README.md"
requires-python = "==3.11.9"

dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "pydantic-settings",
    "crewai>=1.14.7",
    "crewai-tools>=1.14.7",
    "langsmith>=0.8.17",
    "sentence-transformers>=5.6.0",
    "langchain-core>=1.4.8",
    "lancedb>=0.30.0",
    "langchain-community>=0.4.2",
    "asyncpg>=0.31.0",
    "duckduckgo-search<6",
    "ddgs>=9.14.4",
    "pydantic[email]>=2.12.5",
    "selenium>=4.45.0",
    "webdriver-manager>=4.1.2",
    "streamlit>=1.58.0",
    "litellm>=1.84",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
]

[tool.uv]
package = false
